<link rel="stylesheet" href="styles.css">
<section id="register">
    <h2>Student Registration Form</h2>

    <form id="registrationForm">

        <div class="form-group">
            <label for="name">Full Name:</label>
            <input type="text" id="name" name="name" required>
        </div>

        <div class="form-group">
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>
        </div>

        <div class="form-group">
            <label for="roll">Roll Number:</label>
            <input type="text" id="roll" name="roll" required>
        </div>

        <div class="form-group">
            <label for="department">Department:</label>
            <select id="department" name="department" required>
                <option value="">Select Department</option>
                <option value="CSE">CSE</option>
                <option value="ECE">ECE</option>
                <option value="EEE">EEE</option>
                <option value="MECH">Mechanical</option>
            </select>
        </div>

        <div class="form-group">
            <p><strong>Select Gender:</strong></p>

            <input type="radio" id="male" name="gender" value="Male">
            <label for="male">Male</label>

            <input type="radio" id="female" name="gender" value="Female">
            <label for="female">Female</label>
        </div>

        <div class="form-group">
            <p><strong>Select Activities:</strong></p>

            <input type="checkbox" id="sports" name="activities" value="Sports">
            <label for="sports">Sports</label>

            <input type="checkbox" id="music" name="activities" value="Music">
            <label for="music">Music</label>

            <input type="checkbox" id="coding" name="activities" value="Coding">
            <label for="coding">Coding</label>
        </div>

        <div class="form-group">
            <label for="message">Why do you want to participate?</label>
            <textarea id="message" name="message" rows="2"></textarea>
        </div>

        <button type="submit">Register Now</button>

    </form>
</section>
